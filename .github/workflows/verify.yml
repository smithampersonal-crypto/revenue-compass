name: Verify

# Reproducible ARC verification: application tests, types, lint, production
# build, and the Phase 7 database suites against a local Supabase stack.
# Nothing here needs a production service-role secret.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Tests, types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build

  database:
    name: Phase 7 database suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3
      - run: supabase start
      - name: Run every SQL suite
        run: |
          set -euo pipefail
          for suite in supabase/tests/*.sql; do
            echo "== $suite"
            psql "$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')" \
              -v ON_ERROR_STOP=1 -f "$suite"
          done
      - if: always()
        run: supabase stop --no-backup
