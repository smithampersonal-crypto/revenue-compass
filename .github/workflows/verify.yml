name: Verify

# Reproducible ARC verification: application tests, types, lint, production
# build, client-bundle secret audit, and the Phase 7 database suites against a
# local Supabase stack started with the project-pinned CLI.
# No production secret of any kind is used here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Tests, types, lint, build, bundle audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run verify

  database:
    name: Phase 7 database suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      # Project-pinned Supabase CLI (devDependency), identical to local runs.
      - run: bun install --frozen-lockfile
      - run: bun run db:start
      # Same source-controlled runner as `bun run db:test` locally. Any false
      # assertion raises in SQL, so psql exits non-zero and this job fails.
      - run: bun run db:test
      - if: always()
        run: bunx --bun supabase stop --no-backup
